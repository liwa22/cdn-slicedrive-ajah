<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Player</title>

  <style>
    body {
      margin: 0;
      background: #000;
    }

    video {
      width: 100%;
      height: 100vh;
      object-fit: contain;
      background: #000;
    }
  </style>
</head>

<body>

  <video
    id="player"
    controls
    playsinline
    controlsList="nodownload">
  </video>

  <script>
    const JSON_URL = "videos.json";

    const DIRECT_LINK =
      "https://www.profitableratecpmnetwork.com/whsja470u1?key=104b52f9c0a61aadfcb77cf47d84e848";

    const video = document.getElementById("player");

    let clicked = false;
    let redirected = false;

    fetch(JSON_URL)
      .then(res => res.json())
      .then(data => {

        const vids = data.videos;

        const id = decodeURIComponent(
          location.hash.replace("#/", "")
        );

        let selected = vids.find(
          v => v.id === id
        );

        if (!selected) {
          selected = vids[0];
        }

        video.src = selected.cdn;
      });

    video.addEventListener("click", () => {
      if (!clicked) {
        clicked = true;
        window.location.href = DIRECT_LINK;
      }
    }, { once: true });

    video.addEventListener("timeupdate", () => {
      if (!redirected && video.currentTime >= 30) {
        redirected = true;
        window.location.href = DIRECT_LINK;
      }
    });
  </script>

</body>
</html>
